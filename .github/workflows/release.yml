name: Release
on:
  push:
    tags: ['omega/v*', 'piers/v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip release creation — build the zip only'
        type: boolean
        default: false

permissions:
  contents: write

env:
  addon_id: skin.contuary

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect branch from tag
        id: branch
        run: |
          if [[ "$GITHUB_REF_NAME" == */* ]]; then
            echo "name=${GITHUB_REF_NAME%%/*}" >> $GITHUB_OUTPUT
          else
            echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Build zip
        run: ./build.sh "${{ github.workspace }}/artifacts" "${{ steps.branch.outputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.addon_id }}-${{ steps.branch.outputs.name }}
          path: ${{ github.workspace }}/artifacts/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect branch from tag
        id: branch
        run: |
          if [[ "$GITHUB_REF_NAME" == */* ]]; then
            echo "name=${GITHUB_REF_NAME%%/*}" >> $GITHUB_OUTPUT
          else
            echo "name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.addon_id }}-${{ steps.branch.outputs.name }}
          path: artifacts

      - name: Get version and changelog
        id: meta
        run: |
          version=$(sed -n 's/.*<addon[^>]* version="\([^"]*\)".*/\1/p' addon.xml | head -1)
          echo "version=$version" >> $GITHUB_OUTPUT

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else
            branch=$(git rev-parse --abbrev-ref HEAD)
            echo "tag=${branch}/v${version}" >> $GITHUB_OUTPUT
          fi

          if [[ -f changelog.txt ]]; then
            changes=$(awk -v RS= 'NR==1' changelog.txt)
          else
            changes="Release $version"
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changes<<$EOF" >> $GITHUB_OUTPUT
          echo "$changes" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ env.addon_id }} ${{ steps.meta.outputs.version }} (${{ steps.branch.outputs.name }})
          body: ${{ steps.meta.outputs.changes }}
          draft: true
          files: artifacts/*.zip
