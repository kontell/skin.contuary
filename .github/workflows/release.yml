# Tag release: gate, build the channel's zip, draft a GitHub release whose body
# is the top paragraph of changelog.txt.
#
# Releases are per-channel: omega/vX.Y.Z, piers/vX.Y.Z and kodi23/vX.Y.Z. The
# channel is the tag's own prefix and the repository.kontell directory the build
# is served from. Each is cut on the branch of the same name, except kodi23,
# which is cut on master.
#
# The guard below refuses a tag pointing into another channel's history. omega
# has no common ancestor with the others; master is branched from piers, so the
# guard also refuses a kodi23 tag that piers has. Both checks are exact rather
# than heuristic.
#
# master follows Kodi's development branch, so kodi23 releases are pre-releases,
# which repository.kontell serves from dev/kodi23.
name: Release

on:
  push:
    tags: ["omega/v*", "piers/v*", "kodi23/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip release creation — run checks and build only"
        type: boolean
        default: false

# Least privilege by default: check/package only read. The release job alone
# needs write. (Was contents: write at workflow level, which gave the build write
# access it never needed.)
permissions:
  contents: read

env:
  ADDON_ID: skin.contuary

jobs:
  check:
    name: xml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: XML is well-formed
        run: python3 tools/check_xml.py

  package:
    name: package
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.channel.outputs.name }}
      branch: ${{ steps.channel.outputs.branch }}
      version: ${{ steps.channel.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed by the channel guard: it asks whether the tag's commit is an
          # ancestor of the channel branch, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Resolve channel and version
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            channel="${tag%%/*}"
            case "$channel" in
              omega|piers) branch="$channel" ;;
              kodi23) branch=master ;;
              *) echo "channel '$channel' is not omega, piers or kodi23" >&2; exit 1 ;;
            esac
          else
            tag=""
            branch="$(git rev-parse --abbrev-ref HEAD)"
            case "$branch" in
              omega|piers) channel="$branch" ;;
              master) channel=kodi23 ;;
              *) echo "branch '$branch' is not omega, piers or master" >&2; exit 1 ;;
            esac
          fi
          version="$(sed -n 's/.*<addon[^>]* version="\([^"]*\)".*/\1/p' addon.xml | head -1)"
          echo "name=$channel" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel branch=$branch version=$version tag=${tag:-<none>}"

      - name: Assert tag matches addon.xml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.channel.outputs.version }}"
          # omega/v2.2.0 -> 2.2.0
          tag_version="${GITHUB_REF_NAME#*/v}"
          echo "addon.xml version=$version  tag version=$tag_version"
          if [[ "$tag_version" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match addon.xml version $version" >&2
            exit 1
          fi

      - name: Assert the tag is in its own channel's history
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          channel="${{ steps.channel.outputs.name }}"
          branch="${{ steps.channel.outputs.branch }}"
          git fetch --quiet origin "$branch"
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME" "origin/$branch"; then
            echo "::error::tag $GITHUB_REF_NAME is not an ancestor of origin/$branch." \
                 "A ${channel} tag on another branch's history would publish the wrong" \
                 "skin into ${channel}/ in the repository. Retag on $branch."
            exit 1
          fi
          # Everything on piers reaches master by merge, so the check above
          # passes a kodi23 tag on a piers commit.
          if [[ "$branch" == master ]]; then
            git fetch --quiet origin piers
            if git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/piers; then
              echo "::error::tag $GITHUB_REF_NAME is in origin/piers' history, so it" \
                   "is a piers build. Retag on a commit of master's own."
              exit 1
            fi
          fi
          echo "$GITHUB_REF_NAME is in origin/$branch — correct channel."

      - name: Build zip
        run: python3 tools/build.py dist --channel "${{ steps.channel.outputs.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ADDON_ID }}-${{ steps.channel.outputs.name }}-release-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write # draft GitHub release + asset upload
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
    steps:
      - uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ADDON_ID }}-${{ needs.package.outputs.channel }}-release-zip
          path: dist

      - name: Get changelog
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.package.outputs.version }}"
          channel="${{ needs.package.outputs.channel }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${channel}/v${version}" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f changelog.txt ]]; then
            changes="$(awk -v RS= 'NR==1' changelog.txt)"
          else
            changes="Release $version"
          fi
          EOF="$(dd if=/dev/urandom bs=15 count=1 status=none | base64)"
          {
            echo "changes<<$EOF"
            echo "$changes"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ env.ADDON_ID }} ${{ needs.package.outputs.version }} (${{ needs.package.outputs.channel }})
          body: ${{ steps.meta.outputs.changes }}
          draft: true
          prerelease: ${{ needs.package.outputs.channel == 'kodi23' }}
          files: dist/*.zip
